<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOM-7 — Touch to Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d10;
    --line: rgba(79,216,232,0.14);
    --line-strong: rgba(79,216,232,0.32);
    --cyan:#4fd8e8;
    --cyan-dim: rgba(79,216,232,0.55);
    --amber:#ff9142;
    --red:#ff5d6c;
    --text:#e8eef1;
    --text-dim:#7c8a93;
    --text-faint:#4a565d;
    --mono:'JetBrains Mono', monospace;
    --display:'Space Grotesk', sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:44px 44px;
    font-family:var(--mono);
  }

  .frame{ position:absolute; inset:16px; border:1px solid var(--line-strong); pointer-events:none; }
  .corner{ position:absolute; width:20px; height:20px; border:1.5px solid var(--cyan); opacity:.8; }
  .corner.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .corner.tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; }
  .corner.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .hud-top{
    position:absolute; top:34px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 44px;
    font-size:11px; letter-spacing:.08em; color:var(--text-dim);
  }
  .hud-top b{ color:var(--cyan); font-weight:500; }

  .stage{
    position:relative;
    width:min(88vw, 900px);
    aspect-ratio: 900/700;
  }

  .hint{
    position:absolute; left:50%; bottom:8%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.16em; color:var(--cyan);
    opacity:1; transition:opacity .5s ease;
    pointer-events:none;
  }
  .hint .pulse-dot{
    width:7px; height:7px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 10px var(--cyan);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .stage.opened .hint{ opacity:0; }

  svg{ width:100%; height:100%; overflow:visible; cursor:pointer; }

  /* shell panels */
  .shell{ transition: transform .7s cubic-bezier(.2,.85,.25,1), opacity .7s ease; transform-origin:center; }
  .shell.left{ transform: translate(0,0) rotate(0deg); }
  .shell.right{ transform: translate(0,0) rotate(0deg); }
  .stage.opened .shell.left{ transform: translate(-92px,-34px) rotate(-22deg); opacity:.12; }
  .stage.opened .shell.right{ transform: translate(92px,-34px) rotate(22deg); opacity:.12; }

  /* pcb + harness reveal */
  .reveal-layer{ opacity:0; transform:scale(.92); transform-origin:450px 320px; transition: opacity .5s ease .18s, transform .5s cubic-bezier(.2,.85,.25,1) .18s; }
  .stage.opened .reveal-layer{ opacity:1; transform:scale(1); }

  .trace{
    fill:none; stroke-linecap:round;
    transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.2,1);
  }
  .trace:nth-of-type(1){ transition-delay:.05s; }
  .trace:nth-of-type(2){ transition-delay:.1s; }
  .trace:nth-of-type(3){ transition-delay:.15s; }
  .trace:nth-of-type(4){ transition-delay:.2s; }
  .trace:nth-of-type(5){ transition-delay:.3s; }
  .trace:nth-of-type(6){ transition-delay:.35s; }
  .trace:nth-of-type(7){ transition-delay:.4s; }
  .trace:nth-of-type(8){ transition-delay:.45s; }
  .trace:nth-of-type(9){ transition-delay:.55s; }
  .trace:nth-of-type(10){ transition-delay:.6s; }
  .stage.opened .trace{ stroke-dashoffset:0; }
  .pin{ opacity:0; transition: opacity .4s ease; }
  .stage.opened .pin{ opacity:1; transition-delay: 1.1s; }

  .tag{
    position:absolute; font-size:10.5px; letter-spacing:.05em; color:var(--text-dim);
    display:flex; align-items:center; gap:7px; white-space:nowrap;
    opacity:0; transition:opacity .5s ease;
    pointer-events:none;
  }
  .stage.opened .tag{ opacity:1; transition-delay:1.3s; }
  .tag .sw{ width:8px; height:8px; border-radius:2px; flex:none; }
  .tag b{ color:var(--text); font-weight:500; }

  .close-btn{
    position:absolute; top:34px; right:44px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--text-dim);
    border:1px solid var(--line-strong); padding:7px 14px; border-radius:100px;
    opacity:0; pointer-events:none; transition:opacity .4s ease; cursor:pointer;
    background:transparent;
  }
  .stage.opened ~ .close-btn{ opacity:1; pointer-events:auto; }
  .close-btn:hover{ color:var(--cyan); border-color:var(--cyan-dim); }

  .caption{
    position:absolute; bottom:34px; left:0; right:0; text-align:center;
    font-size:11px; color:var(--text-faint); letter-spacing:.1em;
  }
</style>
</head>
<body>

<div class="frame"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div>

<div class="hud-top">
  <span>UNIT <b>AXIOM-7</b> / CHASSIS ACCESS</span>
  <span id="statusText">STATUS <b>SEALED</b></span>
</div>

<div class="stage" id="stage">

  <div class="hint"><span class="pulse-dot"></span>TAP THE CHASSIS TO OPEN</div>

  <svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">

    <!-- ===== STATIC AIRFRAME (arms, motors, props, gps, skids, gimbal) ===== -->
    <g stroke="#4fd8e8" stroke-width="2.5" opacity=".85">
      <line x1="415" y1="285" x2="245" y2="150"/>
      <line x1="485" y1="285" x2="655" y2="150"/>
      <line x1="415" y1="355" x2="245" y2="490"/>
      <line x1="485" y1="355" x2="655" y2="490"/>
    </g>
    <g stroke="#7c8a93" stroke-width="1.2" opacity=".5">
      <ellipse cx="245" cy="150" rx="56" ry="8"/><ellipse cx="245" cy="150" rx="8" ry="56"/>
      <ellipse cx="655" cy="150" rx="56" ry="8"/><ellipse cx="655" cy="150" rx="8" ry="56"/>
      <ellipse cx="245" cy="490" rx="56" ry="8"/><ellipse cx="245" cy="490" rx="8" ry="56"/>
      <ellipse cx="655" cy="490" rx="56" ry="8"/><ellipse cx="655" cy="490" rx="8" ry="56"/>
    </g>
    <g fill="none" stroke="rgba(79,216,232,.3)" stroke-width="1" stroke-dasharray="2 5">
      <circle cx="245" cy="150" r="56"/><circle cx="655" cy="150" r="56"/>
      <circle cx="245" cy="490" r="56"/><circle cx="655" cy="490" r="56"/>
    </g>
    <g>
      <circle cx="245" cy="150" r="18" fill="#0e1317" stroke="#4fd8e8" stroke-width="2"/>
      <circle cx="655" cy="150" r="18" fill="#0e1317" stroke="#4fd8e8" stroke-width="2"/>
      <circle cx="245" cy="490" r="18" fill="#0e1317" stroke="#4fd8e8" stroke-width="2"/>
      <circle cx="655" cy="490" r="18" fill="#0e1317" stroke="#4fd8e8" stroke-width="2"/>
      <circle cx="245" cy="150" r="4.5" fill="#4fd8e8"/><circle cx="655" cy="150" r="4.5" fill="#4fd8e8"/>
      <circle cx="245" cy="490" r="4.5" fill="#4fd8e8"/><circle cx="655" cy="490" r="4.5" fill="#4fd8e8"/>
    </g>
    <line x1="450" y1="255" x2="450" y2="215" stroke="#4fd8e8" stroke-width="2"/>
    <circle cx="450" cy="210" r="6" fill="#0e1317" stroke="#4fd8e8" stroke-width="2"/>
    <g stroke="#7c8a93" stroke-width="1.6">
      <line x1="412" y1="392" x2="412" y2="430"/><line x1="488" y1="392" x2="488" y2="430"/>
      <line x1="396" y1="430" x2="428" y2="430"/><line x1="472" y1="430" x2="504" y2="430"/>
    </g>
    <line x1="450" y1="392" x2="450" y2="418" stroke="#4fd8e8" stroke-width="2"/>
    <circle cx="450" cy="432" r="16" fill="#0e1317" stroke="#4fd8e8" stroke-width="2"/>
    <circle cx="450" cy="432" r="6" fill="none" stroke="#4fd8e8" stroke-width="1.4"/>

    <!-- ===== CHASSIS BASE (always visible, sits under everything) ===== -->
    <rect x="398" y="253" width="104" height="141" rx="13" fill="#0b0f12" stroke="rgba(79,216,232,.4)" stroke-width="1.5"/>

    <!-- ===== REVEAL LAYER: PCB + HARNESS (hidden until opened) ===== -->
    <g class="reveal-layer">

      <!-- harness wires: motors — drooping cable bundle, routed away from the straight structural arm so each strand reads clearly -->
      <path class="trace" d="M404,308 C330,400 260,330 249,154" stroke="#ff5d6c" stroke-width="2.1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <path class="trace" d="M404,318 C345,380 275,300 241,154" stroke="#4fd8e8" stroke-width="1.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <path class="trace" d="M496,308 C570,400 640,330 651,154" stroke="#ff5d6c" stroke-width="2.1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <path class="trace" d="M496,318 C555,380 625,300 659,154" stroke="#4fd8e8" stroke-width="1.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <path class="trace" d="M404,332 C330,240 260,310 249,486" stroke="#5a6870" stroke-width="2.1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <path class="trace" d="M404,342 C345,270 275,340 241,486" stroke="#4fd8e8" stroke-width="1.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <path class="trace" d="M496,332 C570,240 640,310 651,486" stroke="#5a6870" stroke-width="2.1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <path class="trace" d="M496,342 C555,270 625,340 659,486" stroke="#4fd8e8" stroke-width="1.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>

      <!-- gps line -->
      <path class="trace" d="M450,258 C450,242 450,228 450,218" stroke="#ffcf6a" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <!-- gimbal / camera signal -->
      <path class="trace" d="M450,388 C450,402 450,410 450,420" stroke="#ff9142" stroke-width="2.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>

      <!-- PCB board -->
      <rect x="410" y="263" width="80" height="120" rx="6" fill="#0c1a14" stroke="#2f7a55" stroke-width="1.4"/>
      <!-- copper traces on board -->
      <g fill="none" stroke="#d4af5a" stroke-width="1" opacity=".85">
        <path d="M420,275 h26 v10 h14"/>
        <path d="M420,292 h18 v18 h22"/>
        <path d="M470,278 v20 h-10 v14"/>
        <path d="M424,330 h50"/>
        <path d="M424,344 h34 v12 h16"/>
        <path d="M436,362 h28"/>
      </g>
      <!-- ICs -->
      <rect x="424" y="278" width="18" height="18" rx="2" fill="#0e1317" stroke="#4fd8e8" stroke-width="1"/>
      <rect x="452" y="296" width="22" height="14" rx="2" fill="#0e1317" stroke="#4fd8e8" stroke-width="1"/>
      <rect x="424" y="316" width="14" height="14" rx="2" fill="#0e1317" stroke="#ff9142" stroke-width="1"/>
      <circle cx="466" cy="352" r="7" fill="#0e1317" stroke="#4fd8e8" stroke-width="1"/>
      <text x="450" y="376" text-anchor="middle" font-family="JetBrains Mono" font-size="6.5" fill="#4a565d" letter-spacing="0.5">FC-MAIN R3</text>

      <!-- connector pins (glow dots at endpoints) -->
      <circle class="pin" cx="249" cy="154" r="3.5" fill="#ff5d6c" style="filter:drop-shadow(0 0 4px #ff5d6c)"/>
      <circle class="pin" cx="651" cy="154" r="3.5" fill="#ff5d6c" style="filter:drop-shadow(0 0 4px #ff5d6c)"/>
      <circle class="pin" cx="249" cy="486" r="3.5" fill="#8a97a0"/>
      <circle class="pin" cx="651" cy="486" r="3.5" fill="#8a97a0"/>
      <circle class="pin" cx="450" cy="218" r="4" fill="#ffcf6a" style="filter:drop-shadow(0 0 4px #ffcf6a)"/>
      <circle class="pin" cx="450" cy="420" r="4" fill="#ff9142" style="filter:drop-shadow(0 0 4px #ff9142)"/>

      <!-- traveling signal pulse -->
      <circle r="3" fill="#4fd8e8" style="filter:drop-shadow(0 0 5px #4fd8e8)">
        <animateMotion dur="2.2s" repeatCount="indefinite" path="M404,318 C345,380 275,300 241,154"/>
      </circle>
    </g>

    <!-- ===== SHELL PANELS (cover the chassis, slide open) ===== -->
    <g class="shell left">
      <path d="M398,266 a13,13 0 0 1 13,-13 h37 v141 h-37 a13,13 0 0 1 -13,-13 z" fill="#141b20" stroke="#4fd8e8" stroke-width="1.6"/>
      <circle cx="410" cy="266" r="2" fill="#3d4a52"/>
      <circle cx="410" cy="381" r="2" fill="#3d4a52"/>
      <line x1="450" y1="258" x2="450" y2="389" stroke="#0a0d10" stroke-width="2"/>
      <text x="424" y="326" font-family="JetBrains Mono" font-size="7" fill="#4a565d" transform="rotate(-90 424 326)">SPEC-7A</text>
    </g>
    <g class="shell right">
      <path d="M502,266 a13,13 0 0 0 -13,-13 h-37 v141 h37 a13,13 0 0 0 13,-13 z" fill="#141b20" stroke="#4fd8e8" stroke-width="1.6"/>
      <circle cx="490" cy="266" r="2" fill="#3d4a52"/>
      <circle cx="490" cy="381" r="2" fill="#3d4a52"/>
    </g>
  </svg>

  <!-- labels -->
  <div class="tag" style="left:44%; top:36%; transform:translate(-100%,-50%);">
    <span class="sw" style="background:#2f7a55;"></span><b>PCB</b>&nbsp;— flight controller board
  </div>
  <div class="tag" style="left:20%; top:24%; transform:translate(-100%,-50%);">
    <span class="sw" style="background:#ff5d6c;"></span>power line — <b>motor 1</b>
  </div>
  <div class="tag" style="left:80%; top:24%; transform:translate(0,-50%);">
    <span class="sw" style="background:#4fd8e8;"></span>signal bus — <b>ESC</b>
  </div>
  <div class="tag" style="left:50%; top:12%; transform:translate(-50%,0);">
    <span class="sw" style="background:#ffcf6a;"></span><b>GPS</b> feed line
  </div>
  <div class="tag" style="left:50%; top:66%; transform:translate(-50%,0);">
    <span class="sw" style="background:#ff9142;"></span><b>Gimbal</b> video signal
  </div>
</div>

<button class="close-btn" id="closeBtn">✕ CLOSE PANEL</button>
<div class="caption">CHASSIS ACCESS — MAIN COMPARTMENT</div>

<script>
  const stage = document.getElementById('stage');
  const status = document.getElementById('statusText');
  const closeBtn = document.getElementById('closeBtn');

  function setOpen(open){
    stage.classList.toggle('opened', open);
    status.innerHTML = open ? 'STATUS <b style="color:#ff9142">OPEN</b>' : 'STATUS <b>SEALED</b>';
  }

  stage.querySelector('svg').addEventListener('click', () => {
    setOpen(!stage.classList.contains('opened'));
  });
  closeBtn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(false); });
</script>

</body>
</html>
